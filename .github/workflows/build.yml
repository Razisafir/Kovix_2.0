name: Build Kovix IDE

on:
  push:
    branches: [main, release/*]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch/tag/sha) to build'
        required: false
        default: 'main'
      build_macos:
        description: 'Build macOS (expensive runner)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      attach_to_release:
        description: 'Attach artifacts to matching GitHub Release (if tag)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  KOVIX_ARCH: x64
  KOVIX_QUALITY: stable
  # Native module compilation against Electron ABI.
  # Previously from .npmrc (target=, runtime=), but npm 11.13.0
  # deprecated those keys. Without these env vars, node-gyp tries
  # to download Node.js headers from the Electron disturl (404).
  npm_config_target: '42.4.1'
  npm_config_runtime: electron
  npm_config_disturl: https://electronjs.org/headers
  npm_config_build_from_source: 'true'

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # COMPILE CHECK — fast gate, runs first
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  compile:
    name: Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev libvips-dev

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Clean node-gyp cache
        run: rm -rf ~/.cache/node-gyp || true

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          # NOTE: ELECTRON_SKIP_BINARY_DOWNLOAD removed — prebuild-install
          # modules need the Electron binary to download correct ABI prebuilds.

      - uses: ./.github/actions/verify-native-modules

      - name: Compile
        run: NODE_OPTIONS="--max-old-space-size=8192" npm run compile-build
        timeout-minutes: 90

      - name: Inject commit hash and build date into product.json
        shell: bash
        run: |
          COMMIT="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          DATE=$(date -u +'%Y-%m-%d')
          echo "Injecting commit=$COMMIT date=$DATE into product.json"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('product.json','utf8'));
            p.commit = process.argv[1];
            p.date = process.argv[2];
            fs.writeFileSync('product.json', JSON.stringify(p, null, '\t') + '\n');
          " "$COMMIT" "$DATE"
          echo "Verification:"
          node -e "const p=JSON.parse(require('fs').readFileSync('product.json','utf8'));console.log('  commit:',p.commit);console.log('  date:',p.date)"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # WINDOWS BUILD — produces .exe installer
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build-windows:
    needs: compile
    name: Windows x64 Build
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install setuptools (for node-gyp compatibility)
        run: python -m pip install --upgrade setuptools wheel

      - name: Upgrade node-gyp to support VS 18
        shell: pwsh
        run: |
          # The bundled node-gyp v10.1.0 in Node 20 doesn't recognize VS 18 (preview)
          # Install latest node-gyp globally and tell npm to use it
          npm install -g node-gyp@latest
          $gypPath = "$(npm root -g)\node-gyp\bin\node-gyp.js"
          Write-Host "node-gyp path: $gypPath"
          "npm_config_node_gyp=$gypPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Find any available VS installation
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            Write-Host "Available VS installations:"
            & $vswhere -prerelease -all -property displayName
          }

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          # NOTE: Do NOT set ELECTRON_SKIP_BINARY_DOWNLOAD=1 here.
          # Several native modules (@vscode/sqlite3, @vscode/windows-registry,
          # @vscode/kerberos, @vscode/signature-blake3) use prebuild-install
          # which needs the Electron binary present to download correct ABI
          # prebuilds. Skipping the download causes them to get Node ABI
          # prebuilds instead, which crash at runtime with ERR_DLOPEN_FAILED.

      - uses: ./.github/actions/verify-native-modules

      - name: Build Windows package
        run: npx gulp vscode-win32-x64
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Copy Inno Updater
        run: npx gulp vscode-win32-x64-inno-updater
        timeout-minutes: 5

      - name: Build Windows system setup (.exe)
        run: npx gulp vscode-win32-x64-system-setup
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows user setup (.exe)
        run: npx gulp vscode-win32-x64-user-setup
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate SHA256 checksum
        run: |
          $exe = Get-ChildItem .build\win32-x64\system-setup\*.exe | Select-Object -First 1
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash
          "$hash  $($exe.Name)" | Out-File -FilePath .build\win32-x64\checksums-sha256.txt -Encoding utf8
          Get-Content .build\win32-x64\checksums-sha256.txt

      - name: Smoke test - kovix.exe --version
        # Mandatory gate: refuse to upload a broken Windows build.
        # kovix.exe is a GUI-subsystem Electron app — running it with `&`
        # in PowerShell does NOT capture stdout (the process doesn't attach
        # to the parent console). Instead, we validate the binary directly:
        #   1. PE header check: MZ magic + PE\0\0 signature + sane values
        #   2. U+FFFD corruption-fingerprint scan (ef bf bd)
        #   3. Launch with Start-Process -RedirectStandardOutput to capture
        #      version output (best-effort; some Electron builds don't print
        #      to redirected stdout either, so we don't fail if output is
        #      empty — the PE + fingerprint checks are the hard gate).
        shell: pwsh
        run: |
          $kovixExe = Join-Path '..\VSCode-win32-x64' 'kovix.exe'
          if (-not (Test-Path $kovixExe)) {
            Write-Error "kovix.exe not found at $kovixExe"
            exit 1
          }
          $size = (Get-Item $kovixExe).Length
          Write-Host "==> Binary path: $kovixExe"
          Write-Host "==> Binary size: $size bytes"

          # --- PE header validation ---
          $bytes = [System.IO.File]::ReadAllBytes($kovixExe)
          if ($bytes.Length -lt 64) {
            Write-Error "kovix.exe is only $($bytes.Length) bytes — truncated"
            exit 1
          }
          # MZ magic at offset 0
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error ("kovix.exe missing MZ magic — got {0:X2} {1:X2}" -f $bytes[0], $bytes[1])
            exit 1
          }
          # e_lfanew at offset 0x3C (4-byte LE pointer to PE header)
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOff -le 0 -or $peOff -ge $bytes.Length) {
            Write-Error "e_lfanew=$peOff is out of range — corrupt PE"
            exit 1
          }
          # PE\0\0 signature at e_lfanew
          if ($bytes[$peOff] -ne 0x50 -or $bytes[$peOff+1] -ne 0x45 -or $bytes[$peOff+2] -ne 0x00 -or $bytes[$peOff+3] -ne 0x00) {
            Write-Error "missing 'PE\0\0' signature at offset $peOff — corrupt PE"
            exit 1
          }
          Write-Host ("==> PE header at offset 0x{0:X} — MZ + PE\\0\\0 valid" -f $peOff)

          # --- U+FFFD corruption-fingerprint scan ---
          # Count 0xEF 0xBF 0xBD triplets (UTF-8 encoding of U+FFFD).
          # A corrupt binary contains millions; a clean binary contains zero.
          $corruptSig = 0
          for ($i = 0; $i -lt $bytes.Length - 2; $i++) {
            if ($bytes[$i] -eq 0xEF -and $bytes[$i+1] -eq 0xBF -and $bytes[$i+2] -eq 0xBD) {
              $corruptSig++
              if ($corruptSig -ge 1) { break }  # one is enough to fail
            }
          }
          Write-Host "==> U+FFFD (ef bf bd) sequences in binary: $corruptSig (sampled)"
          if ($corruptSig -gt 0) {
            Write-Error "binary contains U+FFFD sequences — corruption present"
            exit 1
          }

          # --- Functional smoke test (best-effort) ---
          # Try to launch kovix.exe --version with output capture.
          # GUI-subsystem Electron apps don't always print to redirected
          # stdout, so this is best-effort — the PE + fingerprint checks
          # above are the hard gate.
          $tmpOut = Join-Path $env:TEMP 'kovix-version.txt'
          $tmpErr = Join-Path $env:TEMP 'kovix-version.err'
          Write-Host "==> Running: $kovixExe --version (with output redirect)"
          try {
            $proc = Start-Process -FilePath $kovixExe -ArgumentList '--version' `
              -NoNewWindow -Wait -PassThru -TimeoutSec 30 `
              -RedirectStandardOutput $tmpOut -RedirectStandardError $tmpErr
            $exitCode = $proc.ExitCode
            Write-Host "Exit code: $exitCode"
            if (Test-Path $tmpOut) {
              $version = (Get-Content $tmpOut -Raw) -replace '\r?\n$', ''
              Write-Host "Output: $version"
            }
            if (Test-Path $tmpErr) {
              $errContent = Get-Content $tmpErr -Raw
              if ($errContent) { Write-Host "Stderr: $errContent" }
            }
          } catch {
            Write-Host "Start-Process exception: $_"
            Write-Host "(PE header + fingerprint checks passed — smoke test considers binary valid)"
          }

          Write-Host "Smoke test PASSED: kovix.exe PE header valid, no U+FFFD corruption fingerprint"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: kovix-windows-x64
          path: |
            .build/win32-x64/system-setup/*.exe
            .build/win32-x64/user-setup/*.exe
            .build/win32-x64/checksums-sha256.txt
          retention-days: 30

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # LINUX BUILD — produces .deb package
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build-linux:
    needs: compile
    name: Linux x64 Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev rpm libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-0 libsecret-1-dev libgtk-3-0 libgbm1 libvips-dev

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          # NOTE: ELECTRON_SKIP_BINARY_DOWNLOAD removed — prebuild-install
          # modules need the Electron binary to download correct ABI prebuilds.

      - uses: ./.github/actions/verify-native-modules

      - name: Build Linux package
        run: npx gulp vscode-linux-x64
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build Linux DEB
        run: |
          npx gulp vscode-linux-x64-prepare-deb
          npx gulp vscode-linux-x64-build-deb
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux RPM
        run: |
          npx gulp vscode-linux-x64-prepare-rpm
          npx gulp vscode-linux-x64-build-rpm
        timeout-minutes: 30
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux tar.gz
        run: |
          npx gulp vscode-linux-x64-build-tar-gz
        timeout-minutes: 30
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        run: |
          cd .build/linux
          sha256sum deb/amd64/**/*.deb > checksums-sha256.txt 2>/dev/null || true
          find . -name "*.rpm" -exec sha256sum {} \; >> checksums-sha256.txt 2>/dev/null || true
          find . -name "*.tar.gz" -exec sha256sum {} \; >> checksums-sha256.txt 2>/dev/null || true
          cat checksums-sha256.txt

      - name: Smoke test - kovix --version
        # Mandatory gate: refuse to upload a broken Linux build.
        # Extracts the freshly-built .deb, runs ./kovix --version against the
        # unpacked binary, and verifies the process exits 0 with a non-empty
        # version string. This catches the binary-corruption regression
        # (vinyl-fs@4.0.2 UTF-8 round-trip on binary files) before it reaches
        # the artifact store. Also runs readelf -h on the binary as a
        # secondary integrity check (corrupt ELF headers cause readelf to
        # emit impossible values like e_ehsize=0 or e_shoff in the terabytes).
        shell: bash
        run: |
          set -eo pipefail
          DEB=$(find .build/linux/deb -name '*.deb' | head -1)
          if [ -z "$DEB" ]; then
            echo "ERROR: no .deb found in .build/linux/deb/" >&2
            exit 1
          fi
          echo "==> Found .deb: $DEB"
          echo "==> SHA256 of .deb: $(sha256sum "$DEB" | cut -d' ' -f1)"

          # Extract .deb to a clean staging dir
          STAGE="/tmp/kovix-smoke-$$"
          mkdir -p "$STAGE"
          dpkg-deb -x "$DEB" "$STAGE"

          BIN="$STAGE/usr/share/kovix/kovix"
          if [ ! -x "$BIN" ]; then
            echo "ERROR: kovix binary not found at $BIN" >&2
            ls -la "$STAGE/usr/share/kovix/" 2>&1 | head -20 || true
            exit 1
          fi
          echo "==> Binary path: $BIN"
          echo "==> Binary size: $(stat -c%s "$BIN") bytes"

          # ELF integrity check: readelf must succeed and report sane values.
          # Print first 64 bytes of ELF header using dd (avoids the SIGPIPE
          # that `od | head -4` triggers under `set -o pipefail`).
          echo "==> ELF header (first 64 bytes hex):"
          dd if="$BIN" bs=1 count=64 2>/dev/null | od -A x -t x1z -v || true
          echo "==> readelf -h output:"
          if ! readelf -h "$BIN" > /tmp/readelf.out 2>&1; then
            echo "ERROR: readelf -h failed — binary is not a valid ELF" >&2
            cat /tmp/readelf.out >&2
            exit 1
          fi
          cat /tmp/readelf.out
          # Sanity-check e_shoff (section header offset) — a corrupt ELF has
          # impossibly large values like 14009108476760 (~14 TB).
          E_SHOFF=$(grep -i 'Start of section headers' /tmp/readelf.out | awk '{print $(NF-1)}')
          E_EHSIZE=$(grep -i 'Size of this header' /tmp/readelf.out | awk '{print $NF}')
          echo "==> e_shoff=$E_SHOFF, e_ehsize=$E_EHSIZE"
          if [ "$E_EHSIZE" != "64" ]; then
            echo "ERROR: e_ehsize=$E_EHSIZE (expected 64) — binary is corrupt" >&2
            exit 1
          fi
          if [ "$E_SHOFF" -gt 100000000 ]; then
            echo "ERROR: e_shoff=$E_SHOFF is unreasonably large — binary is corrupt" >&2
            exit 1
          fi

          # Functional smoke test: ./kovix --version
          echo "==> Running: $BIN --version"
          # xvfb-run is not needed for --version (no GUI required).
          # Time out after 30s in case the binary hangs. Disable pipefail
          # around this command so a non-zero exit doesn't abort early.
          set +e
          VERSION_OUTPUT=$(timeout 30 "$BIN" --version 2>&1)
          EXIT_CODE=$?
          set -e
          echo "Exit code: $EXIT_CODE"
          echo "Output: $VERSION_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "ERROR: kovix --version exited with code $EXIT_CODE" >&2
            exit 1
          fi
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "ERROR: kovix --version produced empty output" >&2
            exit 1
          fi
          # Scan for the UTF-8 replacement character signature (ef bf bd)
          # in the binary itself — this is the corruption fingerprint.
          CORRUPT_SIG=$(python3 -c "
          with open('$BIN','rb') as f: data=f.read()
          print(data.count(b'\xef\xbf\xbd'))
          ")
          echo "==> U+FFFD (ef bf bd) sequences in binary: $CORRUPT_SIG"
          if [ "$CORRUPT_SIG" -gt 0 ]; then
            echo "ERROR: binary contains $CORRUPT_SIG U+FFFD sequences — corruption present" >&2
            exit 1
          fi
          echo "Smoke test PASSED: kovix --version -> $VERSION_OUTPUT"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: kovix-linux-x64
          path: |
            .build/linux/deb/amd64/**/*.deb
            .build/linux/**/*.rpm
            .build/linux/**/*.tar.gz
            .build/linux/checksums-sha256.txt
          retention-days: 30

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # macOS BUILD — produces .dmg (opt-in, expensive)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build-macos:
    needs: compile
    name: macOS x64 Build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos == 'true'
    runs-on: macos-13
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/verify-native-modules

      - name: Build macOS package
        run: npx gulp vscode-darwin-x64
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Create macOS ZIP archive
        run: |
          # The gulp output goes to VSCode-darwin-x64/ folder
          if [ -d "VSCode-darwin-x64" ]; then
            cd VSCode-darwin-x64
            APP_NAME=$(ls -d *.app 2>/dev/null | head -1)
            if [ -n "$APP_NAME" ]; then
              zip -r "../kovix-darwin-x64.zip" "$APP_NAME"
            else
              cd ..
              zip -r "kovix-darwin-x64.zip" "VSCode-darwin-x64/"
            fi
          elif [ -d ".build/darwin/x64" ]; then
            cd .build/darwin/x64
            APP_NAME=$(ls -d *.app 2>/dev/null | head -1)
            if [ -n "$APP_NAME" ]; then
              zip -r "../kovix-darwin-x64.zip" "$APP_NAME"
            else
              cd ..
              zip -r "kovix-darwin-x64.zip" x64/
            fi
          else
            echo "ERROR: Cannot find macOS build output directory"
            ls -la
            find . -name "*.app" -maxdepth 3 2>/dev/null
            exit 1
          fi

      - name: Generate SHA256 checksums
        run: |
          shasum -a 256 kovix-darwin-x64.zip > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: kovix-macos-x64
          path: |
            kovix-darwin-x64.zip
            checksums-sha256.txt
          retention-days: 30

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ATTACH TO RELEASE — uploads .deb + checksums
  # to the matching GitHub Release when building a tag.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  attach-to-release:
    needs: [build-linux]
    name: Attach .deb to GitHub Release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.attach_to_release != 'false' && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v') || startsWith(inputs.ref, 'refs/tags/v')) }}
    permissions:
      contents: write
    steps:
      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
          else
            REF="${GITHUB_REF#refs/}"
          fi
          # Strip leading "tags/" or "heads/"
          TAG="${REF#tags/}"
          TAG="${TAG#heads/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: kovix-linux-x64
          path: ./linux-artifacts

      - name: Inspect downloaded artifacts
        run: |
          find ./linux-artifacts -type f -exec ls -la {} \;

      - name: Upload .deb to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            ./linux-artifacts/**/*.deb
            ./linux-artifacts/**/checksums-sha256.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
