name: Build Kovix IDE

on:
  push:
    branches: [main, release/*]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch/tag/sha) to build'
        required: false
        default: 'main'
      build_macos:
        description: 'Build macOS (expensive runner)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      attach_to_release:
        description: 'Attach artifacts to matching GitHub Release (if tag)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  KOVIX_ARCH: x64
  KOVIX_QUALITY: stable
  # Native module compilation against Electron ABI.
  # Previously from .npmrc (target=, runtime=), but npm 11.13.0
  # deprecated those keys. Without these env vars, node-gyp tries
  # to download Node.js headers from the Electron disturl (404).
  npm_config_target: '42.4.1'
  npm_config_runtime: electron
  npm_config_disturl: https://electronjs.org/headers
  npm_config_build_from_source: 'true'

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # COMPILE CHECK — fast gate, runs first
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  compile:
    name: Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev libvips-dev

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Clean node-gyp cache
        run: rm -rf ~/.cache/node-gyp || true

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          # NOTE: ELECTRON_SKIP_BINARY_DOWNLOAD removed — prebuild-install
          # modules need the Electron binary to download correct ABI prebuilds.

      - uses: ./.github/actions/verify-native-modules

      - name: Compile
        run: NODE_OPTIONS="--max-old-space-size=8192" npm run compile-build
        timeout-minutes: 90

      - name: Inject commit hash and build date into product.json
        shell: bash
        run: |
          COMMIT="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          DATE=$(date -u +'%Y-%m-%d')
          echo "Injecting commit=$COMMIT date=$DATE into product.json"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('product.json','utf8'));
            p.commit = process.argv[1];
            p.date = process.argv[2];
            fs.writeFileSync('product.json', JSON.stringify(p, null, '\t') + '\n');
          " "$COMMIT" "$DATE"
          echo "Verification:"
          node -e "const p=JSON.parse(require('fs').readFileSync('product.json','utf8'));console.log('  commit:',p.commit);console.log('  date:',p.date)"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # WINDOWS BUILD — produces .exe installer
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build-windows:
    needs: compile
    name: Windows x64 Build
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install setuptools (for node-gyp compatibility)
        run: python -m pip install --upgrade setuptools wheel

      - name: Upgrade node-gyp to support VS 18
        shell: pwsh
        run: |
          # The bundled node-gyp v10.1.0 in Node 20 doesn't recognize VS 18 (preview)
          # Install latest node-gyp globally and tell npm to use it
          npm install -g node-gyp@latest
          $gypPath = "$(npm root -g)\node-gyp\bin\node-gyp.js"
          Write-Host "node-gyp path: $gypPath"
          "npm_config_node_gyp=$gypPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Find any available VS installation
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            Write-Host "Available VS installations:"
            & $vswhere -prerelease -all -property displayName
          }

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          # NOTE: Do NOT set ELECTRON_SKIP_BINARY_DOWNLOAD=1 here.
          # Several native modules (@vscode/sqlite3, @vscode/windows-registry,
          # @vscode/kerberos, @vscode/signature-blake3) use prebuild-install
          # which needs the Electron binary present to download correct ABI
          # prebuilds. Skipping the download causes them to get Node ABI
          # prebuilds instead, which crash at runtime with ERR_DLOPEN_FAILED.

      - uses: ./.github/actions/verify-native-modules

      - name: Build Windows package
        run: npx gulp vscode-win32-x64
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Copy Inno Updater
        run: npx gulp vscode-win32-x64-inno-updater
        timeout-minutes: 5

      - name: Build Windows system setup (.exe)
        run: npx gulp vscode-win32-x64-system-setup
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows user setup (.exe)
        run: npx gulp vscode-win32-x64-user-setup
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate SHA256 checksum
        run: |
          $exe = Get-ChildItem .build\win32-x64\system-setup\*.exe | Select-Object -First 1
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash
          "$hash  $($exe.Name)" | Out-File -FilePath .build\win32-x64\checksums-sha256.txt -Encoding utf8
          Get-Content .build\win32-x64\checksums-sha256.txt

      - name: Smoke test — verify built binary executes
        shell: pwsh
        run: |
          # CRITICAL GUARDRAIL: This step proves the built Windows binary
          # actually executes. Before this check existed, every "green" CI
          # run produced a corrupted artifact (vinyl-fs@4's default encoding
          # is 'utf8', which UTF-8 decodes and re-encodes binary files,
          # replacing every byte in 0x80-0xFF with U+FFFD). The result was
          # an .exe installer that passed all build checks but contained a
          # non-executable PE binary.
          #
          # This check runs the ACTUAL binary from the unpacked build
          # output (../VSCode-win32-x64/Kovix.exe), BEFORE it gets packaged
          # into the .exe installer. If this fails, the artifact is
          # unusable and the job must fail — do not soften this check.
          $ErrorActionPreference = 'Stop'
          $binary = "..\VSCode-win32-x64\Kovix.exe"
          if (-not (Test-Path $binary)) {
            # The binary might be named differently — search for it
            $candidate = Get-ChildItem -Path "..\VSCode-win32-x64\" -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 100MB } | Select-Object -First 1
            if ($candidate) {
              $binary = $candidate.FullName
              Write-Host "Binary found at alternate path: $binary"
            } else {
              Write-Host "ERROR: Built binary not found at ..\VSCode-win32-x64\Kovix.exe"
              Write-Host "Listing ..\VSCode-win32-x64\ for diagnosis:"
              if (Test-Path "..\VSCode-win32-x64\") {
                Get-ChildItem "..\VSCode-win32-x64\" | Format-Table Name, Length -AutoSize
              } else {
                Write-Host "..\VSCode-win32-x64\ does not exist"
                Write-Host "Listing ..\ for diagnosis:"
                Get-ChildItem "..\" | Format-Table Name -AutoSize
              }
              exit 1
            }
          }
          Write-Host "Binary found: $binary"
          Write-Host "Size: $((Get-Item $binary).Length) bytes"
          Write-Host ""
          Write-Host "Executing: $binary --version"
          # Use Start-Process with redirection because Electron is a GUI
          # subsystem app — PowerShell's & operator doesn't capture stdout
          # or exit codes for GUI apps. Start-Process -Wait -PassThru
          # properly waits for the process and gives us the exit code.
          $stdoutFile = [System.IO.Path]::GetTempFileName()
          $stderrFile = [System.IO.Path]::GetTempFileName()
          try {
            $process = Start-Process -FilePath $binary -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
            $exitCode = $process.ExitCode
          } catch {
            Write-Host "ERROR: Failed to start process: $_"
            exit 1
          }
          $output = Get-Content $stdoutFile -Raw -ErrorAction SilentlyContinue
          $stderrOutput = Get-Content $stderrFile -Raw -ErrorAction SilentlyContinue
          Remove-Item $stdoutFile, $stderrFile -ErrorAction SilentlyContinue
          Write-Host "Exit code: $exitCode"
          Write-Host "Stdout: $output"
          Write-Host "Stderr: $stderrOutput"
          if ($exitCode -ne 0) {
            Write-Host "ERROR: Binary failed to execute (exit code $exitCode)."
            Write-Host "This typically means the PE binary is corrupted."
            Write-Host "Check that encoding:false is set on all gulp.src calls"
            Write-Host "that read binary files in build/gulpfile.vscode.js."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($output)) {
            Write-Host "ERROR: Binary executed but produced no output"
            exit 1
          }
          Write-Host ""
          Write-Host "Smoke test PASSED: binary is executable and returns a version string."

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: kovix-windows-x64
          path: |
            .build/win32-x64/system-setup/*.exe
            .build/win32-x64/user-setup/*.exe
            .build/win32-x64/checksums-sha256.txt
          retention-days: 30

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # LINUX BUILD — produces .deb package
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build-linux:
    needs: compile
    name: Linux x64 Build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev rpm libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-0 libsecret-1-dev libgtk-3-0 libgbm1 libvips-dev

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          # NOTE: ELECTRON_SKIP_BINARY_DOWNLOAD removed — prebuild-install
          # modules need the Electron binary to download correct ABI prebuilds.

      - uses: ./.github/actions/verify-native-modules

      - name: Build Linux package
        run: npx gulp vscode-linux-x64
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build Linux DEB
        run: |
          npx gulp vscode-linux-x64-prepare-deb
          npx gulp vscode-linux-x64-build-deb
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux RPM
        run: |
          npx gulp vscode-linux-x64-prepare-rpm
          npx gulp vscode-linux-x64-build-rpm
        timeout-minutes: 30
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux tar.gz
        run: |
          npx gulp vscode-linux-x64-build-tar-gz
        timeout-minutes: 30
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        run: |
          cd .build/linux
          sha256sum deb/amd64/**/*.deb > checksums-sha256.txt 2>/dev/null || true
          find . -name "*.rpm" -exec sha256sum {} \; >> checksums-sha256.txt 2>/dev/null || true
          find . -name "*.tar.gz" -exec sha256sum {} \; >> checksums-sha256.txt 2>/dev/null || true
          cat checksums-sha256.txt

      - name: Smoke test — verify built binary executes
        run: |
          # CRITICAL GUARDRAIL: This step proves the built binary actually
          # executes. Before this check existed, every "green" CI run
          # produced a corrupted artifact (vinyl-fs@4's default encoding
          # is 'utf8', which UTF-8 decodes and re-encodes binary files,
          # replacing every byte in 0x80-0xFF with U+FFFD). The result
          # was a .deb that passed all build checks but contained a
          # non-executable ELF binary ("Exec format error" on launch).
          #
          # This check runs the ACTUAL binary from the unpacked build
          # output (../VSCode-linux-x64/kovix), BEFORE it gets packaged
          # into the .deb. If this fails, the artifact is unusable and
          # the job must fail — do not soften this check.
          set -e
          BINARY="../VSCode-linux-x64/kovix"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Built binary not found at $BINARY"
            echo "Listing ../ for diagnosis:"
            ls -la ../ | head -20
            exit 1
          fi
          echo "Binary found: $BINARY"
          echo "File type: $(file "$BINARY")"
          echo "Size: $(stat -c%s "$BINARY") bytes"
          echo ""
          echo "Executing: $BINARY --version"
          # --no-sandbox is required because the chrome-sandbox helper
          # binary needs root ownership + mode 4755 (setuid), which the
          # build output doesn't have. This is standard for CI smoke
          # tests of Electron apps.
          # xvfb-run IS needed: Chromium Ozone platform initializes X11 very early
          # before the --version flag is checked, causing a crash on headless CI.
          OUTPUT=$(xvfb-run -a "$BINARY" --no-sandbox --version 2>&1) || {
            echo "ERROR: Binary failed to execute. Output:"
            echo "$OUTPUT"
            echo ""
            echo "First 64 bytes of binary (hex dump):"
            od -A d -t x1 -N 64 "$BINARY"
            echo ""
            echo "If bytes 40-47 contain 'ef bf bd' (UTF-8 U+FFFD), the"
            echo "binary is corrupted by vinyl-fs@4's encoding bug."
            echo "Check that encoding:false is set on all gulp.src calls"
            echo "that read binary files."
            exit 1
          }
          echo "SUCCESS: Binary executed. Output:"
          echo "$OUTPUT"
          # Verify the output contains a version string (not empty, not an error)
          if [ -z "$OUTPUT" ]; then
            echo "ERROR: Binary executed but produced no output"
            exit 1
          fi
          echo ""
          echo "Smoke test PASSED: binary is executable and returns a version string."

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: kovix-linux-x64
          path: |
            .build/linux/deb/amd64/**/*.deb
            .build/linux/**/*.rpm
            .build/linux/**/*.tar.gz
            .build/linux/checksums-sha256.txt
          retention-days: 30

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # macOS BUILD — produces .dmg (opt-in, expensive)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build-macos:
    needs: compile
    name: macOS x64 Build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos == 'true'
    runs-on: macos-13
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/verify-native-modules

      - name: Build macOS package
        run: npx gulp vscode-darwin-x64
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Create macOS ZIP archive
        run: |
          # The gulp output goes to VSCode-darwin-x64/ folder
          if [ -d "VSCode-darwin-x64" ]; then
            cd VSCode-darwin-x64
            APP_NAME=$(ls -d *.app 2>/dev/null | head -1)
            if [ -n "$APP_NAME" ]; then
              zip -r "../kovix-darwin-x64.zip" "$APP_NAME"
            else
              cd ..
              zip -r "kovix-darwin-x64.zip" "VSCode-darwin-x64/"
            fi
          elif [ -d ".build/darwin/x64" ]; then
            cd .build/darwin/x64
            APP_NAME=$(ls -d *.app 2>/dev/null | head -1)
            if [ -n "$APP_NAME" ]; then
              zip -r "../kovix-darwin-x64.zip" "$APP_NAME"
            else
              cd ..
              zip -r "kovix-darwin-x64.zip" x64/
            fi
          else
            echo "ERROR: Cannot find macOS build output directory"
            ls -la
            find . -name "*.app" -maxdepth 3 2>/dev/null
            exit 1
          fi

      - name: Generate SHA256 checksums
        run: |
          shasum -a 256 kovix-darwin-x64.zip > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: kovix-macos-x64
          path: |
            kovix-darwin-x64.zip
            checksums-sha256.txt
          retention-days: 30

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ATTACH TO RELEASE — uploads .deb + checksums
  # to the matching GitHub Release when building a tag.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  attach-to-release:
    needs: [build-linux]
    name: Attach .deb to GitHub Release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.attach_to_release != 'false' && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v') || startsWith(inputs.ref, 'refs/tags/v')) }}
    permissions:
      contents: write
    steps:
      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
          else
            REF="${GITHUB_REF#refs/}"
          fi
          # Strip leading "tags/" or "heads/"
          TAG="${REF#tags/}"
          TAG="${TAG#heads/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: kovix-linux-x64
          path: ./linux-artifacts

      - name: Inspect downloaded artifacts
        run: |
          find ./linux-artifacts -type f -exec ls -la {} \;

      - name: Upload .deb to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            ./linux-artifacts/**/*.deb
            ./linux-artifacts/**/checksums-sha256.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
