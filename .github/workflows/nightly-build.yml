name: Nightly Build

on:
  schedule:
    - cron: '0 5 * * *' # Daily at 5 UTC
  workflow_dispatch:

# Global env vars for native module compilation against Electron ABI.
# These MUST be set before npm ci so that node-gyp downloads
# Electron headers (v42.4.1) instead of Node.js headers.
# Without these, node-gyp gets 404 from electronjs.org/headers.
env:
  npm_config_target: '42.4.1'
  npm_config_runtime: electron
  npm_config_disturl: https://electronjs.org/headers
  npm_config_build_from_source: 'true'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      KOVIX_QUALITY: stable
    steps:
      - uses: actions/checkout@v7

      - name: Setup Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbfile-dev pkg-config libkrb5-dev libx11-dev libxss1 dbus xvfb libgtk-3-0 libgbm1 libsecret-1-dev libvips-dev
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
          sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults
          sudo service xvfb start

      - name: Setup macOS dependencies
        if: runner.os == 'macOS'
        run: |
          xcode-select -p || xcode-select --install

      - name: Set macOS C++ compiler flags for spdlog compat
        if: runner.os == 'macOS'
        run: |
          echo "CXXFLAGS=-Wno-deprecated-literal-operator" >> $GITHUB_ENV
          echo "CFLAGS=-Wno-deprecated-literal-operator" >> $GITHUB_ENV

      - name: Setup Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
          echo "npm_config_msvs_version=2022" >> $env:GITHUB_ENV
          npm install -g node-gyp@latest
          $gypPath = "$(npm root -g)\node-gyp\bin\node-gyp.js"
          echo "npm_config_node_gyp=$gypPath" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.11'

      - name: Install setuptools (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade setuptools wheel

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - uses: ./.github/actions/verify-native-modules

      - run: npm run compile

      - name: Run tests
        if: runner.os == 'Linux'
        run: npm test
        env:
          DISPLAY: ':99.0'
