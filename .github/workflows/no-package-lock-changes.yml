name: Prevent package-lock.json changes in PRs
on:
  pull_request:
    paths:
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  main:
    name: Prevent package-lock.json changes in PRs
    runs-on: ubuntu-latest
    # ponytail: replaced trilom/file-changes-action + octokit/request-action
    # with native git diff — the old actions are deprecated/broken and
    # added two dependency hits for a simple file-existence check.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for package-lock.json changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q 'package-lock\.json$'; then
            echo "::error::Changes to package-lock.json aren't allowed in PRs."
            exit 1
          fi
          echo "No package-lock.json changes found."
