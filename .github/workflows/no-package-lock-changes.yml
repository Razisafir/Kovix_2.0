name: Prevent package-lock.json changes in PRs
on:
  pull_request:
    paths:
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  main:
    name: Prevent package-lock.json changes in PRs
    runs-on: ubuntu-latest
    # ponytail: replaced trilom/file-changes-action + octokit/request-action
    # with native git diff + permission check. The old actions were
    # deprecated/broken but did check PR author permissions — we preserve
    # that: dependabot and users with write+ access are allowed.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check author permission
        id: permission
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.pull_request.user.login
            });
            const allowed = ["admin", "maintain", "write"].includes(data.permission);
            core.setOutput("allowed", allowed);
            core.info(`User ${context.payload.pull_request.user.login} has ${data.permission} — ${allowed ? "allowed" : "blocked"}`);

      - name: Check for package-lock.json changes
        if: steps.permission.outputs.allowed != 'true'
        run: |
          git diff --name-only origin/${{ github.base_ref }} HEAD | grep -q 'package-lock\.json$' && {
            echo "::error::Changes to package-lock.json aren't allowed in PRs from non-maintainers."
            exit 1
          }
          echo "No disallowed package-lock.json changes found."
