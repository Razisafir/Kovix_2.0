name: Pre-Release

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:

# Global env vars for native module compilation against Electron ABI.
# These MUST be set before npm ci so that node-gyp downloads
# Electron headers (v42.4.1) instead of Node.js headers.
# Without these, node-gyp gets 404 from electronjs.org/headers.
env:
  npm_config_target: '42.4.1'
  npm_config_runtime: electron
  npm_config_disturl: https://electronjs.org/headers
  npm_config_build_from_source: 'true'

jobs:
  pre-release-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Pre-release will proceed for ${{ github.ref }}"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping pre-release — not a release/* branch or manual dispatch (ref=${{ github.ref }})"
          fi

  build:
    needs: pre-release-gate
    if: needs.pre-release-gate.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            gulp_task: vscode-win32-x64-inno-updater
            artifact_name: kovix-windows
            artifact_path: .build/win32-x64/**/*.exe
          - os: macos-13
            arch: x64
            gulp_task: vscode-darwin-x64
            artifact_name: kovix-macos
            artifact_path: .build/darwin-x64/**/*.dmg
          - os: ubuntu-latest
            arch: x64
            gulp_task: vscode-linux-x64
            artifact_name: kovix-linux
            artifact_path: .build/linux-x64/**/*.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      KOVIX_ARCH: ${{ matrix.arch }}
      KOVIX_QUALITY: stable
    steps:
      - uses: actions/checkout@v7

      - name: Setup Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev pkg-config libsecret-1-dev libxss1 dbus xvfb libgtk-3-0 libgbm1

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - uses: ./.github/actions/verify-native-modules

      - name: Compile
        run: npm run compile

      - name: Package (${{ matrix.gulp_task }})
        run: node ./node_modules/gulp/bin/gulp.js ${{ matrix.gulp_task }}

      - name: Sign (macOS)
        if: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        env:
          KOVIX_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KOVIX_SIGN_CERT_PATH: ${{ secrets.APPLE_CERT_PATH }}
          KOVIX_SIGN_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: node build/darwin/sign.js

      - name: Sign (Windows)
        if: ${{ secrets.WINDOWS_CERT_PATH != '' }}
        env:
          KOVIX_SIGN_CERT_PATH: ${{ secrets.WINDOWS_CERT_PATH }}
          KOVIX_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: node build/azure-pipelines/common/sign-win32.js

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            kovix-windows/**
            kovix-macos/**
            kovix-linux/**
          body: |
            ## Kovix Pre-Release

            Draft build from `release/*` branch.

            **⚠️ This is a pre-release build — not intended for production use.**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
